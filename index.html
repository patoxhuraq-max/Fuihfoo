<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunnynene - Reviews</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #fdf2f4;
      background-image: radial-gradient(#f472b6 0.75px, transparent 0.75px);
      background-size: 16px 16px;
    }
  </style>
</head>
<body class="flex justify-center min-h-screen py-8 px-4 text-gray-700">

  <div class="w-full max-w-md bg-white/80 backdrop-blur-sm rounded-3xl p-6 shadow-xl border border-pink-100 relative">
    
    <!-- Banner Section -->
    <div class="relative bg-gradient-to-r from-pink-50 to-pink-100 rounded-2xl h-36 flex items-center justify-center border border-pink-200">
      <span class="text-2xl font-bold text-pink-300 tracking-wider">Bunnynene</span>
      <!-- Profile Avatar -->
      <div class="absolute -bottom-8 left-1/2 transform -translate-x-1/2">
        <div class="w-20 h-20 rounded-full border-4 border-white shadow-md bg-pink-200 overflow-hidden flex items-center justify-center">
          <span class="text-3xl">🐰</span>
        </div>
      </div>
    </div>

    <!-- Header Info -->
    <div class="text-center mt-10 mb-6">
      <p class="text-xs text-pink-400 font-semibold tracking-widest uppercase">WELCOME TO</p>
      <h1 class="text-3xl font-serif font-bold text-gray-800">Bunnynene</h1>
      <p class="text-xs text-gray-400 italic mt-1">Thank you with love Bunny nene</p>
      <div class="mt-2">
        <span class="inline-flex items-center gap-1 bg-pink-50 text-pink-600 text-xs px-3 py-1 rounded-full border border-pink-200">
          👑 Admin
        </span>
      </div>
    </div>

    <!-- Rating Summary Cards -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <div class="bg-white rounded-2xl p-4 text-center border border-pink-100 shadow-sm">
        <p class="text-2xl font-bold text-gray-800">18</p>
        <p class="text-xs text-gray-500 font-medium">All Reviews</p>
        <p class="text-[10px] text-gray-400">Customer reviews</p>
      </div>
      <div class="bg-white rounded-2xl p-4 text-center border border-pink-100 shadow-sm">
        <p class="text-2xl font-bold text-gray-800">5.0</p>
        <p class="text-xs text-yellow-400">★★★★★</p>
        <p class="text-[10px] text-gray-400">Average rating</p>
      </div>
    </div>

    <!-- Reviews Header -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-serif italic text-gray-700">All Reviews</h2>
      <span class="bg-yellow-100 text-yellow-700 text-xs font-bold px-2.5 py-0.5 rounded-full">5.0 ★</span>
    </div>

    <!-- Review Items List -->
    <div class="space-y-3 pb-16">
      
      <div class="bg-white p-4 rounded-2xl border border-pink-100 shadow-sm">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="font-bold text-sm text-gray-800">lenho</h3>
            <p class="text-[10px] text-gray-400">Aug 13, 2026</p>
          </div>
          <div class="text-yellow-400 text-xs">★★★★★</div>
        </div>
        <p class="text-xs text-gray-600 mt-2">plusss</p>
      </div>

      <div class="bg-white p-4 rounded-2xl border border-pink-100 shadow-sm">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="font-bold text-sm text-gray-800">น้ำอุ่น</h3>
            <p class="text-[10px] text-gray-400">Aug 12, 2026</p>
          </div>
          <div class="text-yellow-400 text-xs">★★★★★</div>
        </div>
        <p class="text-xs text-gray-600 mt-2">พลัสค่า</p>
      </div>

      <div class="bg-white p-4 rounded-2xl border border-pink-100 shadow-sm">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="font-bold text-sm text-gray-800">เจสซี่</h3>
            <p class="text-[10px] text-gray-400">Aug 11, 2026</p>
          </div>
          <div class="text-yellow-400 text-xs">★★★★★</div>
        </div>
        <p class="text-xs text-gray-600 mt-2">พลัสค้บ เติมไวมากๆ♡</p>
      </div>

    </div>

    <!-- Floating Action Button -->
    <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-10">
      <button class="bg-gradient-to-r from-pink-300 to-pink-400 hover:from-pink-400 hover:to-pink-500 text-white font-medium text-xs py-3 px-6 rounded-full shadow-lg border border-white flex items-center gap-2 transition">
        ✏️ Write a review
      </button>
    </div>

  </div>

</body>
</html>
