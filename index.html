<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arne - Reviews</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #fdf2f4;
      background-image: radial-gradient(#f472b6 0.75px, transparent 0.75px);
      background-size: 16px 16px;
      overflow-x: hidden;
    }
    .font-serif-italic {
      font-family: 'Playfair Display', serif;
      font-style: italic;
    }
    .heart {
      position: fixed;
      top: -20px;
      color: #f472b6;
      opacity: 0.6;
      font-size: 14px;
      user-select: none;
      pointer-events: none;
      z-index: 1;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body class="flex justify-center min-h-screen py-8 px-4 text-gray-700 relative">

  <!-- Main Container -->
  <div class="w-full max-w-md bg-white/80 backdrop-blur-sm rounded-3xl p-6 shadow-xl border border-pink-100 relative z-10">
    
    <!-- Banner Section -->
    <div class="relative bg-gradient-to-r from-pink-50 to-pink-100 rounded-2xl h-36 border border-pink-200 overflow-visible">
      <img src="https://i.postimg.cc/rwZq1pVM/line-oa-chat-260814-232551.jpg" alt="Cover" class="w-full h-full object-cover rounded-2xl opacity-90">
      
      <!-- Profile Avatar -->
      <div class="absolute -bottom-10 left-1/2 transform -translate-x-1/2 z-20">
        <div class="w-20 h-20 rounded-full border-4 border-white shadow-md bg-pink-100 overflow-hidden">
          <img src="https://i.postimg.cc/W1YsG4NL/line-oa-chat-260814-232628.jpg" alt="Arne Profile" class="w-full h-full object-cover">
        </div>
      </div>
    </div>

    <!-- Header Info -->
    <div class="text-center mt-12 mb-6">
      <p class="text-[10px] text-pink-400 font-semibold tracking-widest uppercase">WELCOME TO</p>
      <h1 class="text-3xl font-serif font-bold text-gray-800">Arne</h1>
      <p class="text-xs text-gray-400 italic mt-1">Thank you with love arne</p>
      
      <!-- Admin Button Status -->
      <div class="mt-3" id="adminHeaderBtn">
        <button onclick="openModal('adminModal')" class="inline-flex items-center gap-1 bg-white hover:bg-pink-50 text-gray-600 text-xs px-3.5 py-1 rounded-full border border-pink-200 shadow-sm transition">
          👑 Admin Login
        </button>
      </div>
    </div>

    <!-- Rating Summary Cards -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <div class="bg-white rounded-2xl p-4 text-center border border-pink-100 shadow-sm">
        <p id="totalReviewsCount" class="text-2xl font-bold text-gray-800">0</p>
        <p class="text-xs text-gray-500 font-medium">All Reviews</p>
        <p class="text-[10px] text-gray-400">Customer reviews</p>
      </div>
      <div class="bg-white rounded-2xl p-4 text-center border border-pink-100 shadow-sm">
        <p id="avgRatingScore" class="text-2xl font-bold text-gray-800">5.0</p>
        <p id="avgRatingStars" class="text-xs text-yellow-400">★★★★★</p>
        <p class="text-[10px] text-gray-400">Average rating</p>
      </div>
    </div>

    <!-- Reviews Header -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-serif-italic text-gray-700">All Reviews</h2>
      <span id="badgeAvgRating" class="bg-yellow-100 text-yellow-700 text-xs font-bold px-2.5 py-0.5 rounded-full">5.0 ★</span>
    </div>

    <!-- Review Items List Container -->
    <div id="reviewsList" class="space-y-3 pb-16">
      <!-- Dynamic Reviews Inserted Here -->
    </div>

    <!-- Floating Action Button -->
    <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-20">
      <button onclick="openModal('reviewModal')" class="bg-gradient-to-r from-pink-300 to-pink-400 hover:from-pink-400 hover:to-pink-500 text-white font-medium text-xs py-3 px-6 rounded-full shadow-lg border border-white flex items-center gap-2 transition transform active:scale-95">
        ✏️ Write a review
      </button>
    </div>

  </div>

  <!-- Modal Backdrop -->
  <div id="modalBackdrop" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-30 hidden transition-opacity"></div>

  <!-- Admin Login Modal -->
  <div id="adminModal" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-sm bg-white/95 rounded-3xl p-6 shadow-2xl z-40 hidden border border-pink-100">
    <div class="flex justify-between items-start mb-2">
      <div>
        <p class="text-[10px] text-pink-400 font-semibold uppercase tracking-wider">Arne</p>
        <h3 class="text-2xl font-serif-italic text-gray-700">Admin Login</h3>
      </div>
      <button onclick="closeModal('adminModal')" class="text-gray-400 hover:text-gray-600 text-lg">✕</button>
    </div>
    
    <form class="space-y-4 mt-4" onsubmit="handleAdminLogin(event)">
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Password</label>
        <input id="adminPassword" type="password" placeholder="Enter admin password" class="w-full text-xs px-4 py-3 rounded-xl border border-pink-100 focus:outline-none focus:border-pink-300 bg-pink-50/20">
        <p id="passwordError" class="text-[10px] text-red-400 mt-1 hidden">รหัสผ่านไม่ถูกต้อง</p>
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-pink-300 to-pink-400 text-white text-xs font-semibold py-3 rounded-xl shadow-md hover:from-pink-400 hover:to-pink-500 transition">
        Log in
      </button>
    </form>
  </div>

  <!-- Edit Review Modal (Admin) -->
  <div id="editModal" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-sm bg-white/95 rounded-3xl p-6 shadow-2xl z-40 hidden border border-pink-100">
    <div class="flex justify-between items-start mb-2">
      <div>
        <p class="text-[10px] text-pink-400 font-semibold uppercase tracking-wider">ADMIN MODE</p>
        <h3 class="text-2xl font-serif-italic text-gray-700">Edit Review</h3>
      </div>
      <button onclick="closeModal('editModal')" class="text-gray-400 hover:text-gray-600 text-lg">✕</button>
    </div>
    
    <form class="space-y-3 mt-3" onsubmit="saveEditedReview(event)">
      <input type="hidden" id="editReviewId">
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Customer Name</label>
        <input id="editCustomerName" type="text" required class="w-full text-xs px-4 py-2.5 rounded-xl border border-pink-100 focus:outline-none focus:border-pink-300 bg-pink-50/20">
      </div>
      
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Rating</label>
        <select id="editRating" class="w-full text-xs px-4 py-2.5 rounded-xl border border-pink-100 focus:outline-none focus:border-pink-300 bg-pink-50/20">
          <option value="5">★★★★★ (5 Stars)</option>
          <option value="4">★★★★☆ (4 Stars)</option>
          <option value="3">★★★☆☆ (3 Stars)</option>
          <option value="2">★★☆☆☆ (2 Stars)</option>
          <option value="1">★☆☆☆☆ (1 Star)</option>
        </select>
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Review Comment</label>
        <textarea id="editComment" rows="3" required class="w-full text-xs p-3 rounded-xl border border-pink-100 focus:outline-none focus:border-pink-300 bg-pink-50/20 resize-none"></textarea>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-pink-300 to-pink-400 text-white text-xs font-semibold py-3 rounded-xl shadow-md hover:from-pink-400 hover:to-pink-500 transition mt-2">
        Save Changes
      </button>
    </form>
  </div>

  <!-- Write Review Modal -->
  <div id="reviewModal" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-sm bg-white/95 rounded-3xl p-6 shadow-2xl z-40 hidden border border-pink-100">
    <div class="flex justify-between items-start mb-2">
      <div>
        <p class="text-[10px] text-pink-400 font-semibold uppercase tracking-wider">SHARE THE LOVE</p>
        <h3 class="text-2xl font-serif-italic text-gray-700">Write a review</h3>
      </div>
      <button onclick="closeModal('reviewModal')" class="text-gray-400 hover:text-gray-600 text-lg">✕</button>
    </div>
    
    <form class="space-y-3 mt-3" onsubmit="handleAddReview(event)">
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Your name</label>
        <input id="newCustomerName" type="text" placeholder="Your name" required class="w-full text-xs px-4 py-2.5 rounded-xl border border-pink-100 focus:outline-none focus:border-pink-300 bg-pink-50/20">
      </div>
      
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Your rating</label>
        <div class="flex gap-1 text-yellow-400 text-xl" id="starSelector">
          <span onclick="setRating(1)" class="cursor-pointer">★</span>
          <span onclick="setRating(2)" class="cursor-pointer">★</span>
          <span onclick="setRating(3)" class="cursor-pointer">★</span>
          <span onclick="setRating(4)" class="cursor-pointer">★</span>
          <span onclick="setRating(5)" class="cursor-pointer">★</span>
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Your review</label>
        <textarea id="newComment" rows="3" placeholder="Write something sweet..." required class="w-full text-xs p-3 rounded-xl border border-pink-100 focus:outline-none focus:border-pink-300 bg-pink-50/20 resize-none"></textarea>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-pink-300 to-pink-400 text-white text-xs font-semibold py-3 rounded-xl shadow-md hover:from-pink-400 hover:to-pink-500 transition mt-2">
        Post review
      </button>
    </form>
  </div>

  <script>
    let isAdmin = false;
    let selectedRating = 5;

    let reviews = [
      { id: 1, name: "lenho", date: "Aug 13, 2026", rating: 5, comment: "plusss" },
      { id: 2, name: "น้ำอุ่น", date: "Aug 12, 2026", rating: 5, comment: "พลัสค่า" },
      { id: 3, name: "เจสซี่", date: "Aug 11, 2026", rating: 5, comment: "พลัสค้าบ เติมไวมากๆ♡" }
    ];

    function renderReviews() {
      const container = document.getElementById('reviewsList');
      container.innerHTML = '';

      reviews.forEach(item => {
        const stars = '★'.repeat(item.rating) + '☆'.repeat(5 - item.rating);
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-2xl border border-pink-100 shadow-sm relative";
        
        let adminButtons = '';
        if (isAdmin) {
          adminButtons = `
            <div class="flex gap-2 mt-3 pt-2 border-t border-pink-50 justify-end">
              <button onclick="openEditModal(${item.id})" class="text-[11px] bg-pink-50 hover:bg-pink-100 text-pink-600 px-2.5 py-1 rounded-lg transition font-medium">✏️ แก้ไข</button>
              <button onclick="deleteReview(${item.id})" class="text-[11px] bg-red-50 hover:bg-red-100 text-red-500 px-2.5 py-1 rounded-lg transition font-medium">🗑️ ลบ</button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-bold text-sm text-gray-800">${escapeHtml(item.name)}</h3>
              <p class="text-[10px] text-gray-400">${item.date}</p>
            </div>
            <div class="text-yellow-400 text-xs">${stars}</div>
          </div>
          <p class="text-xs text-gray-600 mt-2">${escapeHtml(item.comment)}</p>
          ${adminButtons}
        `;
        container.appendChild(card);
      });

      updateStats();
    }

    function updateStats() {
      const total = reviews.length;
      document.getElementById('totalReviewsCount').innerText = total;

      if (total === 0) {
        document.getElementById('avgRatingScore').innerText = "0.0";
        document.getElementById('avgRatingStars').innerText = "☆☆☆☆☆";
        document.getElementById('badgeAvgRating').innerText = "0.0 ★";
        return;
      }

      const avg = (reviews.reduce((sum, item) => sum + item.rating, 0) / total).toFixed(1);
      document.getElementById('avgRatingScore').innerText = avg;
      document.getElementById('badgeAvgRating').innerText = `${avg} ★`;
      
      const roundedStars = Math.round(parseFloat(avg));
      document.getElementById('avgRatingStars').innerText = '★'.repeat(roundedStars) + '☆'.repeat(5 - roundedStars);
    }

    function openModal(id) {
      document.getElementById('modalBackdrop').classList.remove('hidden');
      document.getElementById(id).classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById('modalBackdrop').classList.add('hidden');
      document.getElementById(id).classList.add('hidden');
      if (id === 'adminModal') {
        document.getElementById('passwordError').classList.add('hidden');
        document.getElementById('adminPassword').value = '';
      }
    }

    document.getElementById('modalBackdrop').addEventListener('click', () => {
      closeModal('adminModal');
      closeModal('reviewModal');
      closeModal('editModal');
    });

    function handleAdminLogin(event) {
      event.preventDefault();
      const pwd = document.getElementById('adminPassword').value;
      if (pwd === 'Kanticha') {
        isAdmin = true;
        updateAdminHeader();
        renderReviews();
        closeModal('adminModal');
      } else {
        document.getElementById('passwordError').classList.remove('hidden');
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      updateAdminHeader();
      renderReviews();
    }

    function updateAdminHeader() {
      const container = document.getElementById('adminHeaderBtn');
      if (isAdmin) {
        container.innerHTML = `
          <div class="inline-flex items-center gap-2 bg-pink-100 text-pink-700 text-xs px-3 py-1 rounded-full border border-pink-200">
            <span>👑 Admin Mode</span>
            <button onclick="logoutAdmin()" class="bg-white hover:bg-pink-50 text-gray-600 px-2 py-0.5 rounded-full text-[10px] shadow-sm font-semibold ml-1">ออกจากระบบ</button>
          </div>
        `;
      } else {
        container.innerHTML = `
          <button onclick="openModal('adminModal')" class="inline-flex items-center gap-1 bg-white hover:bg-pink-50 text-gray-600 text-xs px-3.5 py-1 rounded-full border border-pink-200 shadow-sm transition">
            👑 Admin Login
          </button>
        `;
      }
    }

    function deleteReview(id) {
      if (confirm('คุณต้องการลบรีวิวนี้ใช่หรือไม่?')) {
        reviews = reviews.filter(r => r.id !== id);
        renderReviews();
      }
    }

    function openEditModal(id) {
      const item = reviews.find(r => r.id === id);
      if (!item) return;

      document.getElementById('editReviewId').value = item.id;
      document.getElementById('editCustomerName').value = item.name;
      document.getElementById('editRating').value = item.rating;
      document.getElementById('editComment').value = item.comment;

      openModal('editModal');
    }

    function saveEditedReview(event) {
      event.preventDefault();
      const id = parseInt(document.getElementById('editReviewId').value);
      const name = document.getElementById('editCustomerName').value;
      const rating = parseInt(document.getElementById('editRating').value);
      const comment = document.getElementById('editComment').value;

      const index = reviews.findIndex(r => r.id === id);
      if (index !== -1) {
        reviews[index].name = name;
        reviews[index].rating = rating;
        reviews[index].comment = comment;
        renderReviews();
      }

      closeModal('editModal');
    }

    function setRating(r) {
      selectedRating = r;
      const stars = document.querySelectorAll('#starSelector span');
      stars.forEach((star, index) => {
        star.style.opacity = index < r ? "1" : "0.3";
      });
    }

    function handleAddReview(event) {
      event.preventDefault();
      const name = document.getElementById('newCustomerName').value;
      const comment = document.getElementById('newComment').value;
      const today = new Date();
      const dateStr = today.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      const newId = reviews.length > 0 ? Math.max(...reviews.map(r => r.id)) + 1 : 1;
      reviews.unshift({
        id: newId,
        name: name,
        date: dateStr,
        rating: selectedRating,
        comment: comment
      });

      document.getElementById('newCustomerName').value = '';
      document.getElementById('newComment').value = '';
      setRating(5);
      renderReviews();
      closeModal('reviewModal');
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '♡';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 4 + 's';
      heart.style.fontSize = Math.random() * 10 + 10 + 'px';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createHeart, 400);
    renderReviews();
  </script>

</body>
</html>
